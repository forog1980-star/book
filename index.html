<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var BUILD_VER = '2026-11-11-v10';
        try {
          var prevVer = localStorage.getItem('markaz_app_build_ver');
          if (prevVer !== BUILD_VER) {
            localStorage.setItem('markaz_app_build_ver', BUILD_VER);
            var tasks = [];
            if ('caches' in window) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      if (k.indexOf('markaz-asnad-') === 0 && k !== 'markaz-asnad-main-book-v10') {
                        return caches.delete(k);
                      }
                      return Promise.resolve();
                    })
                  );
                })
              );
            }
            if ('serviceWorker' in navigator) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(
                    regs.map(function (r) {
                      return r.update().catch(function () {});
                    })
                  );
                })
              );
            }
            Promise.all(tasks).finally(function () {
              if (prevVer && window.location.search.indexOf('_bv=' + BUILD_VER) === -1) {
                var url = new URL(window.location.href);
                url.searchParams.set('_bv', BUILD_VER);
                window.location.replace(url.toString());
              }
            });
          }
        } catch (e) {}
      })();
    </script>
