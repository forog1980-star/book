<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var BUILD_VER = '2026-11-11-v11';
        var ACTIVE_CACHE = 'markaz-asnad-main-book-v11';

        function purgeOldCachesAndSW() {
          var tasks = [];
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    if (k !== ACTIVE_CACHE) {
                      return caches.delete(k);
                    }
                    return Promise.resolve();
                  })
                );
              })
            );
          }
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.update().catch(function () {});
                  })
                );
              })
            );
          }
          return Promise.all(tasks);
        }

        try {
          var prevVer = localStorage.getItem('markaz_app_build_ver');
          if (prevVer !== BUILD_VER) {
            localStorage.setItem('markaz_app_build_ver', BUILD_VER);
            purgeOldCachesAndSW().finally(function () {
              if (prevVer && window.location.search.indexOf('_bv=' + BUILD_VER) === -1) {
                var url = new URL(window.location.href);
                url.searchParams.set('_bv', BUILD_VER);
                window.location.replace(url.toString());
              }
            });
          }
        } catch (e) {}

        // بررسی زنده نسخه اسکریپت سرور در موبایل و دسکتاپ تا حتی در صورت بازگشت صفحه از کش مرورگر گوشی، بلافاصله نسخه جدید جایگزین شود
        function verifyLatestServerBundle() {
          try {
            if (!navigator.onLine) return;
            var checkUrl = new URL('./index.html', window.location.href);
            checkUrl.searchParams.set('_check', String(Date.now()));
            fetch(checkUrl.toString(), { cache: 'no-store', credentials: 'same-origin' })
              .then(function (r) {
                return r.ok ? r.text() : '';
              })
              .then(function (html) {
                if (!html) return;
                var match = html.match(/src=["']([^"']*\/assets\/index-[^"']+\.js)["']/);
                if (!match || !match[1]) return;
                var serverScript = match[1].split('/').pop();
                var loadedScripts = document.querySelectorAll('script[type="module"][src]');
                var currentScript = '';
                for (var i = 0; i < loadedScripts.length; i++) {
                  var s = loadedScripts[i].getAttribute('src') || '';
                  if (s.indexOf('/assets/index-') !== -1) {
                    currentScript = s.split('/').pop();
                    break;
                  }
                }
                if (currentScript && serverScript && currentScript !== serverScript) {
                  purgeOldCachesAndSW().finally(function () {
                    var reloadUrl = new URL(window.location.href);
                    reloadUrl.searchParams.set('_bv', serverScript.replace(/[^a-zA-Z0-9_-]/g, ''));
                    window.location.replace(reloadUrl.toString());
                  });
                }
              })
              .catch(function () {});
          } catch (e) {}
        }

        window.addEventListener('load', function () {
          setTimeout(verifyLatestServerBundle, 150);
        });
        window.addEventListener('pageshow', function (ev) {
          if (ev && ev.persisted) {
            verifyLatestServerBundle();
          }
        });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            verifyLatestServerBundle();
          }
        });
      })();
    </script>
    <meta name="theme-color" content="#8C3B2B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مرکز اسناد" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>نرم‌افزار کتابخانه و مرکز اسناد گلزار شهدای تهران</title>
    <meta name="description" content="سامانه جامع مدیریت مخزن کتب، میز امانت، آرشیو دست‌نوشته‌ها و کتاب‌شناسی قطعات گلزار شهدای بهشت زهرا (س) تهران" />
    <meta property="og:title" content="نرم‌افزار کتابخانه و مرکز اسناد گلزار شهدای تهران" />

  </head>
