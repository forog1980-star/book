<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var BUILD_VER = '2026-11-11-v12';
        var ACTIVE_CACHE = 'markaz-asnad-main-book-v12';

        function purgeOldCaches() {
          if (!('caches' in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(
              keys.map(function (k) {
                if (k !== ACTIVE_CACHE) {
                  return caches.delete(k);
                }
                return Promise.resolve();
              })
            );
          });
        }

        try {
          var prevVer = localStorage.getItem('markaz_app_build_ver');
          if (prevVer !== BUILD_VER) {
            localStorage.setItem('markaz_app_build_ver', BUILD_VER);
            purgeOldCaches();
          }
        } catch (e) {}

        // بررسی آرام نسخه اسکریپت سرور تا اگر مرورگر موبایل فایل قدیمی را از حافظه برگردانده بود، یک‌بار نسخه جدید بارگذاری شود
        var isCheckingBundle = false;
        function verifyLatestServerBundle() {
          if (isCheckingBundle) return;
          try {
            if (!navigator.onLine) return;
            var loadedScripts = document.querySelectorAll('script[type="module"][src]');
            var currentScript = '';
            for (var i = 0; i < loadedScripts.length; i++) {
              var s = loadedScripts[i].getAttribute('src') || '';
              if (s.indexOf('/assets/index-') !== -1) {
                currentScript = s.split('/').pop();
                break;
              }
            }
            // در محیط dev که فایل /src/main.tsx است، نیازی به رفرش خودکار نیست
            if (!currentScript) return;

            isCheckingBundle = true;
            var checkUrl = new URL('./index.html', window.location.href);
            checkUrl.searchParams.set('_check', String(Date.now()));
            fetch(checkUrl.toString(), { cache: 'no-store', credentials: 'same-origin' })
              .then(function (r) {
                return r.ok ? r.text() : '';
              })
              .then(function (html) {
                if (!html) return;
                var match = html.match(/src=["']([^"']*\/assets\/index-[^"']+\.js)["']/);
                if (!match || !match[1]) return;
                var serverScript = match[1].split('/').pop();
                if (currentScript && serverScript && currentScript !== serverScript) {
                  var reloadKey = 'markaz_reloaded_for_' + serverScript;
                  if (sessionStorage.getItem(reloadKey) === '1') return;
                  sessionStorage.setItem(reloadKey, '1');
                  purgeOldCaches().finally(function () {
                    window.location.reload();
                  });
                }
              })
              .catch(function () {})
              .finally(function () {
                isCheckingBundle = false;
              });
          } catch (e) {
            isCheckingBundle = false;
          }
        }

        window.addEventListener('pageshow', function (ev) {
          if (ev && ev.persisted) {
            verifyLatestServerBundle();
          }
        });
      })();
    </script>
    <meta name="theme-color" content="#8C3B2B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مرکز اسناد" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>نرم‌افزار کتابخانه و مرکز اسناد گلزار شهدای تهران</title>
    <meta name="description" content="سامانه جامع مدیریت مخزن کتب، میز امانت، آرشیو دست‌نوشته‌ها و کتاب‌شناسی قطعات گلزار شهدای بهشت زهرا (س) تهران" />
    <meta property="og:title" content="نرم‌افزار کتابخانه و مرکز اسناد گلزار شهدای تهران" />
    <meta property="og:description" content="سامانه جامع مدیریت مخزن کتب، میز امانت، آرشیو دست‌نوشته‌ها و کتاب‌شناسی قطعات گلزار شهدای بهشت زهرا (س) تهران" />

  </head>
